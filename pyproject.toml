[project]
name = "championai-mini"
version = "0.1.0"
description = "A production-minded mini AI agent platform for manufacturing incident triage."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "asyncpg>=0.30",
  "mcp[cli]>=2.0",
  "a2a-sdk[fastapi]>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "deepeval>=3.0",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "evals*"]
